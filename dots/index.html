<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロボット AR バトル</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#e7eef5;color:#12283e}#hud{position:fixed;z-index:10;top:12px;left:12px;right:12px;max-width:440px;background:#ffffffed;padding:16px;border-radius:18px;box-shadow:0 4px 28px #1233}h1{font-size:20px;margin:0 0 10px}p{margin:8px 0;font-size:14px}progress{width:100%;height:24px;accent-color:#087f8c}button,a{touch-action:manipulation}button{font-size:18px;padding:12px 18px;border:0;border-radius:10px;background:#087f8c;color:white;min-height:48px}button:disabled{opacity:.45}#reset{background:#42566a}#controls{display:flex;gap:8px;margin:10px 0}a{color:#00657a}#flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:#f44;opacity:0;transition:opacity .12s}#flash.hit{opacity:.17}#status{min-height:2.6em}label{font-size:14px}
</style>
</head>
<body>
<div id="hud">
<h1>ロボット AR バトル</h1>
<div id="hpText">HP 100 / 100</div><progress id="hpBar" max="100" value="100" aria-label="ロボットのHP"></progress>
<div id="controls"><button id="attack" disabled>攻撃 −25</button><button id="reset" disabled>リセット</button></div>
<label><input id="sound" type="checkbox"> 効果音を鳴らす</label>
<p id="status" role="status" aria-live="polite">モデルを読み込んでいます…</p>
<p id="guide">カメラを許可して Hiro マーカーを映してください。</p>
<a id="modeLink" href="?preview=1">カメラなしで試す</a>
</div>
<div id="flash"></div>
<script src="battle.js"></script>
</body>
</html>
