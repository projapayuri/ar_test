
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>GLBをボタンで操作</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* ボタンをカメラ映像の上に表示 */
    #controls {
      position: fixed;
      bottom: 30px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 1000;
    }

    button {
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- 操作用ボタン -->
  <div id="controls">
    <button onclick="rotateRobot()">回転</button>
    <button onclick="bigger()">＋</button>
    <button onclick="smaller()">－</button>
    <button onclick="toggleRobot()">表示切替</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam">

    <a-marker preset="hiro">

      <!-- 展示台 -->
      <a-cylinder
        position="0 0.05 0"
        radius="0.6"
        height="0.1"
        color="#444">
      </a-cylinder>

      <!-- ロボット -->
      <a-gltf-model
        id="robot"
        src="robot.glb"
        position="0 0.18 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

    </a-marker>

    <!-- AR用カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    // ロボットを取得
    const robot = document.querySelector('#robot');

    // 回転角度
    let angle = 0;

    // 大きさ
    let size = 0.5;

    // 表示状態
    let isVisible = true;

    // 1. 回転
    function rotateRobot() {
      angle += 90;
      robot.setAttribute('rotation', `0 ${angle} 0`);
    }

    // 2. 大きくする
    function bigger() {
      size += 0.1;
      robot.setAttribute('scale', `${size} ${size} ${size}`);
    }

    // 3. 小さくする
    function smaller() {
      if (size > 0.1) {
        size = Math.max(0.1, size - 0.1);
        robot.setAttribute('scale', `${size} ${size} ${size}`);
      }
    }

    // 4. 表示・非表示
    function toggleRobot() {
      isVisible = !isVisible;
      robot.setAttribute('visible', isVisible);
    }
  </script>

</body>
</html>
