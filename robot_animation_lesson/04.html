<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ロボットのアニメーション</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        #hud button, #hud select {
            min-height: 48px;
            padding: 12px 20px;
            font-size: 20px;
        }
        #hud label { background: white; padding: 4px; }
    </style>
</head>
<body>
    <div id="hud">
        <button id="walkButton" type="button">歩く</button>
        <button id="danceButton" type="button">踊る</button>
    </div>
    <a-scene embedded arjs="sourceType: webcam">
        <a-marker preset="hiro" smooth="true">
            <a-gltf-model id="exhibit" src="robot.glb"
                          position="0 0 0.5" scale="0.3 0.3 0.3" rotation="-90 0 0"
                          animation-mixer="clip: RobotArmature|Robot_Dance; timeScale: 1">
            </a-gltf-model>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <script>
        const exhibit = document.getElementById('exhibit');
        const walkButton = document.getElementById('walkButton');
        const danceButton = document.getElementById('danceButton');

        function walkRobot() {
            exhibit.setAttribute('animation-mixer', 'clip', 'RobotArmature|Robot_Walking');
        }

        function danceRobot() {
            exhibit.setAttribute('animation-mixer', 'clip', 'RobotArmature|Robot_Dance');
        }

        walkButton.addEventListener('click', walkRobot);
        danceButton.addEventListener('click', danceRobot);
    </script>
</body>
</html>
