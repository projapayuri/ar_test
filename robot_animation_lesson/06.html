<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ロボットのアニメーション</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        #hud button,
        #hud select {
            min-height: 48px;
            padding: 12px 20px;
            font-size: 20px;
        }

        #hud label {
            background: white;
            padding: 4px;
        }
    </style>
</head>

<body>
    <div id="hud">
        <label for="animationSelect">動き</label>
        <select id="animationSelect">
            <option value="0" selected>待機</option>
            <option value="1">歩く</option>
            <option value="2">踊る</option>
            <option value="3">手を振る</option>
        </select>
        <button id="pauseButton" type="button">一時停止</button>
        <button id="resumeButton" type="button">再開</button>
    </div>
    <a-scene embedded arjs="sourceType: webcam">
        <a-marker preset="hiro" smooth="true">
            <a-gltf-model id="exhibit" src="robot.glb" position="0 0 0.5" scale="0.3 0.3 0.3" rotation="-90 0 0"
                animation-mixer="clip: RobotArmature|Robot_Idle; timeScale: 1">
            </a-gltf-model>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <script>
        const exhibit = document.getElementById('exhibit');
        const pauseButton = document.getElementById('pauseButton');
        const resumeButton = document.getElementById('resumeButton');
        const animationSelect = document.getElementById('animationSelect');
        const animations = [
            'RobotArmature|Robot_Idle',
            'RobotArmature|Robot_Walking',
            'RobotArmature|Robot_Dance',
            'RobotArmature|Robot_Wave'
        ];
        let currentClip = 'RobotArmature|Robot_Idle';
        let speed = 1;
        let isPaused = false;

        // 先に速度を0へ。再利用される動きにも選んだ速さを確実に適用する。
        function applyAnimation() {
            exhibit.setAttribute('animation-mixer', 'timeScale', 0);
            exhibit.setAttribute('animation-mixer', 'clip', currentClip);
            if (isPaused) {
                exhibit.setAttribute('animation-mixer', 'timeScale', 0);
            } else {
                exhibit.setAttribute('animation-mixer', 'timeScale', speed);
            }
        }

        function pauseAnimation() {
            isPaused = true;
            applyAnimation();
        }

        function resumeAnimation() {
            isPaused = false;
            applyAnimation();
        }

        pauseButton.addEventListener('click', pauseAnimation);
        resumeButton.addEventListener('click', resumeAnimation);

        function changeAnimation() {
            const index = Number(animationSelect.value);
            currentClip = animations[index];
            applyAnimation();
        }

        animationSelect.addEventListener('change', changeAnimation);
    </script>
</body>

</html>
